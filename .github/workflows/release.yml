name: release

on:
  push:
    branches: [main]
  # Publish an existing release tag again, for example after a failed publish.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.2.0)
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    # always() lets the manual run start even though the release job is skipped.
    if: always() && (needs.release.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      # No token: npm authenticates this workflow through OIDC (trusted publisher set on npmjs.com)
      - run: npm publish --provenance --access public
